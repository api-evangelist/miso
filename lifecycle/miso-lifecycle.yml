generated: '2026-07-27'
method: searched
source: >-
  https://www.misoenergy.org/markets-and-operations/RTDataAPIs/ (the 2025-12-12 restructure
  notice), https://api.misoenergy.org/MISORTWDDataBroker/data-links.html (the legacy surface,
  still reachable), https://help.misoenergy.org/knowledgebase/article/KA-01489/en-us,
  https://www.misoenergy.org/markets-and-operations/notifications/it-and-system-notifications/,
  https://www.misoenergy.org/markets-and-operations/MSE/, plus derivation from openapi/.
description: >-
  MISO versions its two public surfaces in two different ways and publishes neither policy
  formally. The Data Exchange gateway is versioned in the URI path at v1 and has not
  changed version. The Public API is versioned by announcement: on 2025-12-12 MISO moved it
  to a new host, changed every URL and dropped CSV and XML in favour of JSON only. There is
  no written deprecation policy, no RFC 8594 Sunset or Deprecation header support, no
  numeric SLA and no Statuspage-style uptime dashboard anywhere on any MISO host.

versioning:
  data-exchange:
    scheme: uri-path
    current: v1
    mechanism: /v1/ segment on every operation
    docs: https://data-exchange.misoenergy.org/apis
  public-api:
    scheme: none
    current: null
    effective_release: '2025-12-12'
    docs: https://www.misoenergy.org/markets-and-operations/RTDataAPIs/
    note: >-
      No version token in the URL and no version header. The harvested specification uses
      2025-12-12 as its info.version because that is the date of the restructure MISO
      announced, not a version MISO publishes.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    MISO publishes no deprecation policy document, gives no advance-notice commitment, and
    emits neither the RFC 8594 Sunset header nor the Deprecation header. Deliberately
    recorded as absent — no Deprecation pointer is claimed in apis.yml.
  events:
    - date: '2025-12-12'
      kind: breaking-change
      surface: Public API
      announcement: https://www.misoenergy.org/markets-and-operations/RTDataAPIs/
      quote: >-
        "As of December 12, 2025, these data feeds are available in JSON format only.
        Please be aware that the underlying URLs have also changed for all links. This
        implementation is designed to improve consistency, performance, and future
        compatibility for accessing real-time data."
      impact:
        - Host moved from api.misoenergy.org/MISORTWDDataBroker to public-api.misoenergy.org
        - CSV and XML response formats withdrawn; JSON only
        - Every endpoint URL changed
      migration_guide: null
      grace_period: none published

