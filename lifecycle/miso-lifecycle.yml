sla:
  url: null
  uptime_target: null
  note: >-
    No uptime commitment of any kind. MISO's published product terms are the opposite of an
    SLA — "MISO DOES NOT WARRANT THAT ITS SITES WILL BE UNINTERRUPTED OR ERROR-FREE ...
    distributed on an AS IS, AS AVAILABLE basis."

status_page: https://www.misoenergy.org/markets-and-operations/notifications/it-and-system-notifications/
status_page_kind: notifications-feed
status_page_note: >-
  MISO runs no Statuspage/Statusgator-style component dashboard — status.misoenergy.org does
  not resolve, and misoenergy.statuspage.io is an unclaimed Atlassian marketing redirect,
  not a MISO page. What MISO does publish is an IT and System Notifications feed where
  system outages, maintenance windows and incident notices are posted, times in Eastern.
  Retention is short and explicit: "all Notifications except Market Settlements
  Notifications will be deleted after 30 days of the issue date." That feed is recorded here
  as MISO's operational-status surface; the limitation is stated rather than papered over.

roadmap: https://www.misoenergy.org/markets-and-operations/MSE/
roadmap_note: >-
  The Market System Enhancements (MSE) programme is MISO's published forward-looking
  roadmap for the market systems that sit behind these APIs — Model Manager, the Day-Ahead
  and Real-Time Market Clearing Engines, the Operator Interface, an upgraded Energy
  Management System and the New Market User Interface (the MUI 2.0 surface in this
  profile). MISO publishes an MSE timeline graphic and gives quarterly stakeholder updates;
  RT-MCE is stated as expected to complete in 2026.

data_revision_policy:
  interchange_window_days: 105
  quote: >-
    "Data available within the interchange endpoints are subject to change up to 105 days
    after the market day due to reconciliation."
  source: MISO Data Exchange portal operation metadata

deprecated_operations: []
deprecated_operations_note: >-
  No operation in any of the four harvested OpenAPI documents carries deprecated: true.

change_log: null
change_log_note: >-
  MISO publishes no dated API changelog or release-notes feed for either the Public API or
  Data Exchange. The 2025-12-12 restructure was announced as page copy on the RT Data APIs
  page, not as a changelog entry. No ChangeLog pointer is claimed.
