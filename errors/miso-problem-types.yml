format: none
format_note: >-
  Not RFC 9457. No application/problem+json media type appears anywhere in MISO's surface,
  and MISO publishes no error reference page. The 400/401/404 responses declared on every
  Data Exchange operation carry a description and no schema and no example, so the
  operation-level error body shape is genuinely undocumented — MISO's published error
  contract is the status code and its description, nothing more. What is documented is the
  Azure API Management gateway envelope, observed live.
