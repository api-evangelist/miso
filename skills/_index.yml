shared_rules:
  - All MISO market intervals are Eastern Standard Time (UTC−05:00) year-round.
  - Every public MISO operation is a GET. There is no write surface and no idempotency contract.
  - Data Exchange limits are per subscription - 100 calls/minute (429) and 24,000 calls/day (403),
    neither of which is declared in the OpenAPI.
  - Interchange values are provisional for up to 105 days after the market day due to reconciliation.
  - The 401 description on every Data Exchange operation says "Bearer Token"; the real credential
    is the Ocp-Apim-Subscription-Key subscription key.
