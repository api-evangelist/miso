aid: miso
url: https://raw.githubusercontent.com/api-evangelist/miso/refs/heads/main/apis.yml
name: MISO
kind: company
description: 'MISO — the Midcontinent Independent System Operator — is the not-for-profit Regional Transmission
  Organization that operates the electric grid and the wholesale electricity markets across fifteen US
  states and the Canadian province of Manitoba, serving a footprint of roughly forty-five million people
  from headquarters in Carmel, Indiana. Formed in 1998 and operating the region since December 2001, it
  is regulated by the Federal Energy Regulatory Commission, dispatches generation in real time, clears
  day-ahead and real-time energy and ancillary services markets, runs the ARR/FTR market and the generator
  interconnection queue, and plans the transmission system. It sits squarely in the middle of the value
  chain: it owns no generation, no wires and no retail customers, but it holds the market-wide operational
  data that every generator, transmission owner, load-serving entity and trader in the Midwest and the
  South depends on. Its API posture is the classic system operator split, and it is an unusually clean
  example of it. On the market side MISO is genuinely open — thirty-seven JSON endpoints at public-api.misoenergy.org
  return real-time fuel mix, load, prices, binding constraints and interchange to an anonymous GET with
  no key, no account and no click-through, and the full market report archive at docs.misoenergy.org downloads
  anonymously as CSV and XLSX. On the consumer side there is nothing to open: MISO is not a retail utility,
  holds no customer usage or billing data, and no energy-data mandate of any kind applies to it. Green
  Button is voluntary in the United States and is a distribution-utility standard; MISO publishes no Green
  Button, ESPI, or consumer data-sharing surface, and makes no claim to. Its newer MISO Data Exchange
  developer portal adds a keyed but self-serve tier over historical market report data, and its MUI 2.0
  market interface is a genuinely closed, client-certificate-gated API for registered market participants
  only.'
image: https://www.misoenergy.org/siteassets/favicons/miso-icon-only---blue-green---whitebg_rgb_192.png
