- aid: miso:miso-mui-2-0-api
  name: MISO Market User Interface (MUI) 2.0 API
  description: 'The closed counterpart to everything else in this profile — MISO''s programmatic JSON
    web API for registered market participants to submit energy supply offers and demand bids, query submissions,
    and query day-ahead and real-time market results as they clear. MISO documents it publicly in the
    MUI 2.0 API User Guide, which states verbatim that "All market participants using the JSON programmatic
    interface must be registered with MISO" and gives the base URL as https://markets.midwestiso.org/dart2
    for production and https://cce.midwestiso.org/dart2 for the customer-facing test environment. Access
    is gated by a client digital certificate issued through the MISO Market Portal: an anonymous TLS connection
    to markets.midwestiso.org on 2026-07-27 failed at the handshake with an SSL alert rather than returning
    any HTTP status, which is direct evidence of mutual-TLS client-certificate enforcement. No OpenAPI
    is published and none could be harvested; the guide PDF is the only contract.'
  humanURL: https://cdn.misoenergy.org/MUI%202.0%20API%20User%20Guide629008.pdf
  baseURL: https://markets.midwestiso.org/dart2
  tags:
  - Energy Markets
  - Market Participants
  - Bids and Offers
  - Day-Ahead
  - Real-Time
  - Client Certificate
  properties:
  - url: https://cdn.misoenergy.org/MUI%202.0%20Specification%203.3.0623177.yaml
    type: X-OpenAPI-Source
  - url: openapi/miso-mui-20-api-openapi.yaml
