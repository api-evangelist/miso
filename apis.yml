- aid: miso:miso-data-exchange-load-generation-interchange-api
  name: MISO Data Exchange Load, Generation, and Interchange API
  description: The system-data half of MISO Data Exchange. Twenty-two documented GET operations spanning
    actual load, day-ahead and real-time cleared demand, day-ahead cleared generation both physical and
    virtual, day-ahead and real-time generation by fuel type, offered and committed generation at ECOMAX
    and ECOMIN, fuel-on-the-margin, day-ahead, real-time and historical net scheduled interchange, real-time
    net actual interchange, real-time binding constraints, real-time and forecast outages, the medium-term
    load forecast, and state estimator load. MISO's own operation metadata carries the warning that interchange
    data is subject to change up to one hundred and five days after the market day due to reconciliation.
    Every operation is date-pathed (/v1/{market}/{yyyy-mm-dd}/...) with optional interval, region and
    paging filters. A subscription key is required — an anonymous GET to https://apim.misoenergy.org/lgi/v1/real-time/2026-07-26/demand/actual
    returned HTTP 401 "Access denied due to missing subscription key" on 2026-07-27 — and that key is
    self-serve with no approval step. The OpenAPI in openapi/ was assembled verbatim from MISO's anonymously
    served portal metadata.
  humanURL: https://data-exchange.misoenergy.org/api-details#api=load-generation-and-interchange-api
  baseURL: https://apim.misoenergy.org/lgi
