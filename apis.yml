- aid: miso:miso-data-exchange-pricing-api
  name: MISO Data Exchange Pricing API
  description: 'The pricing half of MISO Data Exchange, MISO''s Azure API Management developer programme
    over Market Report data. Ten documented GET operations covering day-ahead and real-time ex-ante and
    ex-post locational marginal prices by commercial pricing node, day-ahead and real-time ex-ante and
    ex-post ancillary services market clearing prices by reserve zone, a real-time MCP summary, and an
    aggregated pricing node reference list. Responses are paged and carry the four LMP components — lmp,
    mcc (marginal congestion), mec (marginal energy) and mlc (marginal losses). A subscription key is
    required: an anonymous GET to https://apim.misoenergy.org/pricing/v1/day-ahead/2026-07-26/lmp-expost
    returned HTTP 401 "Access denied due to missing subscription key" on 2026-07-27, while a fabricated
    path on the same gateway returned HTTP 404 "Resource not found" — which is what makes the 401 meaningful.
    The key is self-serve: MISO''s own portal product metadata returns approvalRequired false. The full
    API reference, every operation definition and the component schemas were all readable anonymously
    from the portal''s data API, and the OpenAPI in openapi/ was assembled verbatim from them.'
  humanURL: https://data-exchange.misoenergy.org/api-details#api=pricing-api
  baseURL: https://apim.misoenergy.org/pricing
  tags:
