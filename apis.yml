- aid: miso:miso-market-reports
  name: MISO Market Reports
  description: 'MISO''s long-running bulk market report surface — the second fully anonymous layer of
    its open market data, and the archive the Data Exchange APIs sit on top of. Every published report
    is a plain HTTP GET against docs.misoenergy.org/marketreports/ with no key, no account, no login and
    no licence click-through, returning real CSV, XLSX, XML, ZIP and PDF files named by market date. Confirmed
    anonymous on 2026-07-27: 20260726_da_expost_lmp.csv returned HTTP 200 with 1,165,710 bytes of day-ahead
    ex-post LMP, 20260726_sr_gfm.xlsx returned HTTP 200 with 21,922 bytes, and Dead_Node_Reports_Readers_Guide.pdf
    returned HTTP 200. The report catalogue is browsed from the Market Reports page, which drives an internal
    Episerver Find search service — there is no documented query API, no directory listing (docs.misoenergy.org/marketreports/
    itself returns HTTP 404) and no specification, so this is recorded as a verified public data surface
    rather than a specified API.'
  humanURL: https://www.misoenergy.org/markets-and-operations/real-time--market-data/market-reports/
  baseURL: https://docs.misoenergy.org/marketreports
  tags:
  - Open Data
  - CSV
  - Market Reports
  - Settlements
  - Energy Markets
