  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
- aid: miso:miso-file-download-api
  name: MISO File Download API
  description: 'The bulk file-retrieval counterpart to MUI 2.0, on the same two client-certificate-gated
    hosts and documented only in a PDF. MISO''s File Download Specification lays out a consistent pair
    of operations per report family — GET /portalDownload/{type}/files to list what is available and GET
    /portalDownload/{type}/file to retrieve one — across at least nine types: day-ahead schedule reports
    (dasr), electric quarterly reports (eqr), exposure, invoices, market clearing and market results (mcmr),
    market operations control reports (mocr), resource load and adjustment (rla) and settlement statement
    information (ssi), each with its own query parameters for entity, date, asset owner, market type and
    output format. Production is https://markets.midwestiso.org/portalDownload and the customer-facing
    test environment is https://cce.midwestiso.org/portalDownload. Access is gated exactly as MUI 2.0 is:
    an anonymous TLS connection to either host on 2026-08-06 failed at the handshake with an SSL alert
    rather than returning any HTTP status, which is direct evidence of mutual-TLS client-certificate enforcement.
    NO MACHINE-READABLE CONTRACT IS PUBLISHED FOR THIS API and none could be harvested. MISO does publish
    one for MUI 2.0, at cdn.misoenergy.org, so the capability plainly exists — it was simply never done
    for this surface. The 145KB specification PDF is the only description of it that exists.'
  humanURL: https://cdn.misoenergy.org/MISO%20-%20File%20Download%20Specification424459.pdf
  baseURL: https://markets.midwestiso.org/portalDownload
  tags:
  - Energy Markets
  - Market Participants
  - Bulk Download
  - Settlements
  - Invoices
  - Client Certificate
  properties:
  - type: Documentation
    url: https://cdn.misoenergy.org/MISO%20-%20File%20Download%20Specification424459.pdf
  - type: Onboarding
    url: https://www.misoenergy.org/markets-and-operations/mp-registration/market-participation/
  x-coverage:
    state: gated
    reason: no-machine-readable-spec
    detail: >-
      Documented in a PDF and nowhere else. Searched for a published contract on 2026-08-06 and
      found none: the Wayback CDX index for cdn.misoenergy.org holds no .yaml or .json capture
      other than three .well-known probes that 404'd in 2023, and filtering every archived URL
      for misoenergy.org, www.misoenergy.org, api.misoenergy.org, cce.midwestiso.org and
      markets.midwestiso.org on swagger / openapi / .yaml / .yml / api-docs returns nothing on
      any host, ever. The MUI 2.0 yaml on the same CDN was still live and 514KB on the same day,
      so the CDN does serve specs. Recorded as a documented but uncontracted surface rather than
      reconstructed from the PDF — a spec written from documentation by someone who has never
      called the API would carry MISO's name over inferred error responses and schemas.
    raised_by: A reader, 2026-08-05, who asked for an OpenAPI and was told why we will not author one.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
- aid: miso:miso-weather-information-interface
  name: MISO Weather Information Interface
  description: >-
    MISO's weather data service for market participants, and the ONLY API in this profile
    outside the Data Exchange portal for which MISO publishes a machine-readable contract of its
    own. The OpenAPI 3.0.1 document is distributed as miso_wii_api_spec.json inside a zip on
    MISO's CDN, alongside a rendered HTML view — which is why nothing that crawls for
    /openapi.json or /swagger.json will ever find it. One operation, GET /v{version}/Weather,
    "Obtain weather data for all stations", with 7 component schemas (ApiWeatherResponse,
    WeatherFeature, WeatherHourData, WeatherProperty, ReadingData, GeometryConstraint, ApiError)
    and documented 200/400/401/500 responses. The 401 tells you it is authenticated; the
    document declares no securitySchemes and no servers, so the base URL is not stated in the
    contract itself.
  humanURL: https://cdn.misoenergy.org/miso_wii_api_spec636543.zip
  tags:
  - Weather
  - Energy Markets
  - Market Participants
  properties:
  - type: OpenAPI
    url: openapi/miso-weather-information-interface-api-openapi.yml
  - type: X-OpenAPI-Source
    url: https://cdn.misoenergy.org/miso_wii_api_spec636543.zip
  x-coverage:
    state: covered
    reason: null
    detail: >-
      Harvested 2026-08-07 from MISO's own zip (68,062 bytes, HTTP 200), which contains
      miso_wii_api_spec.json at 605,903 bytes plus a rendered HTML companion. Provider-published
      and unmodified. Discovery is the only hard part: a spec inside a zip on a CDN is
      machine-readable but not machine-DISCOVERABLE, and no amount of well-known probing finds it.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
- aid: miso:miso-ftr-mpma-market-user-api
  name: MISO FTR MPMA Market User API
  description: >-
    The Financial Transmission Rights / Multi-Period Multi-Auction market user API — four SOAP
    services covering the FTR market itself, auctions, bulk download and the secondary market.
    MISO publishes real WSDL contracts for all four, with XSD schemas, and ships two dated
    generations in the same archive: 2023_10_05 and 2026_04_01. This is a CURRENT, maintained
    SOAP estate, not a legacy remnant. Endpoints are published in the archive as plain text —
    production on markets.midwestiso.org/mui-miso-ihedge and the CCE test environment on
    cce.midwestiso.org/mui-miso-ihedge, four services each. Access is gated the same way as MUI
    2.0 and File Download: anonymous TLS to either host fails at the handshake with an SSL alert.
  humanURL: https://cdn.misoenergy.org/FTR%20MPMA%20Market%20User%20API%20Documents742934.zip
  baseURL: https://markets.midwestiso.org/mui-miso-ihedge
  tags:
  - Energy Markets
  - FTR
  - Auctions
  - Secondary Market
  - Market Participants
  - SOAP
  - Client Certificate
  properties:
  - type: Documentation
    url: https://cdn.misoenergy.org/FTR%20MPMA%20Market%20User%20API%20Documents742934.zip
  x-coverage:
    state: gated
    reason: contract-format-unreadable
    detail: >-
      MISO DOES publish machine-readable contracts here — 12 WSDL files across the two
      generations, plus 33 XSD schemas in the archive. They are not catalogued as contracts
      because the Kin Score cannot currently read WSDL, not because they are absent. This is a
      READER gap on our side, and recording it as "no spec" would be false. See the roadmap
      issue on WSDL as an unreadable contract format.
    services:
    - MarketService
    - FtrAuctionService
    - FtrDownloadService
    - SecondaryMarketService
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
- aid: miso:miso-edr-service
  name: MISO EDR Service (Electronic Data Reporting)
  description: >-
    A SOAP service for uploading meter data and offer data to MISO, with a published WSDL and
    six XSD schemas (MdUploadPayload, MdUploadResponse, MeterData, OfferData,
    OfferDataUploadPayload, OfferUploadResponse). The archive dates to 2008, which makes this the
    oldest surface in the profile — and notable for being one of the few MISO interfaces that is
    explicitly a WRITE path: participants upload meter and offer data rather than retrieve it.
  humanURL: https://cdn.misoenergy.org/EDR%20WSDL%20and%20Schemas632992.zip
  tags:
  - Energy Markets
  - Meter Data
  - Offers
  - Market Participants
  - SOAP
  - Write Surface
  properties:
  - type: Documentation
    url: https://cdn.misoenergy.org/EDR%20WSDL%20and%20Schemas632992.zip
  x-coverage:
    state: gated
    reason: contract-format-unreadable
    detail: >-
      A published WSDL (EdrService.wsdl) and six XSDs exist and were fetched 2026-08-07. Not
      catalogued as a contract because we cannot read WSDL, not because MISO failed to publish one.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
- aid: miso:miso-crow-api
  name: MISO CROW API (Outage Scheduling)
  description: >-
    The outage-scheduling interface, built on the CROW product, documented in a PDF reference
    plus a MISO-specific addendum and shipped with worked XML request and response examples —
    submit, cancel and withdraw outage requests, including cancellation over specified periods or
    an entire outage. Like EDR this is a write surface: it exists so participants can lodge and
    change outage requests, not merely read them.
  humanURL: https://cdn.misoenergy.org/CROW%20API%20Documents372592.zip
  tags:
  - Energy Markets
  - Outages
  - Scheduling
  - Market Participants
  - Write Surface
  properties:
  - type: Documentation
    url: https://cdn.misoenergy.org/CROW%20API%20Documents372592.zip
  x-coverage:
    state: gated
    reason: no-machine-readable-spec
    detail: >-
      PDF reference documents and XML examples only — no WSDL, no XSD, no OpenAPI in the archive
      fetched 2026-08-07. The XML examples describe the wire format but are samples, not a contract.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
