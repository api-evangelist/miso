actions:
- target: $.info
  update:
    x-apievangelist-provider: miso
    x-apievangelist-aid: miso:miso-data-exchange-load-generation-interchange-api
    x-apievangelist-artifacts:
      authentication: authentication/miso-authentication.yml
      conventions: conventions/miso-conventions.yml
      errors: errors/miso-problem-types.yml
      lifecycle: lifecycle/miso-lifecycle.yml
