  /markets/notifications/{day}/emergency-notification/participants/{participantName}/messages:
    description: Returns the filtered list of public and private messages that have
      been issued by the market operator and sent to a particpant.
    parameters:
    - {$ref: '#/components/parameters/x-acting-participant'}
    get:
      tags: [Notifications]
      description: Returns the filtered list of public and private messages that have
        been issued by the market operator and sent to a particpant since a certain
        time. A public message is a message that is available to all market participants.  A
        private message is a message directed to a specific set (of one or more market
        participants). A message has an associated priority.  A message's priority
        is specified as a integer number from 0 through 999. The only meaning applied
        to these priorities is that the priority 0 value represents an emergency notification
        message. If since is not provided then return all filtered notifications since
        start of day requested.
      operationId: getEmergencyNotificationHistory
      parameters:
      - {$ref: '#/components/parameters/MarketOperatingDay'}
      - {$ref: '#/components/parameters/Participant'}
      - name: since
        description: Date-time as defined in RFC 3339 having format YYYY-MM-DDTHH:MM:SS-05:00.
          This value does not need to be on a 5-minute boundary. If not provided then
          messages sent since start of day are returned.
        in: query
        required: false
        schema: {$ref: '#/components/schemas/MarketIntervalLabel'}
      - name: realm
        description: Value specifying the realm to query as public only, private,
          or both public and private.  If not specified, the query is for public messages
          only.
        in: query
        required: false
        schema:
          type: string
          enum: [Private, Public, Both]
      - name: priority
        description: Element specifying the priority threshold.  A value specified
          means that only those messages whose priority code is less than or equal
          to the threshold specified are returned.  By default, all message priorities
          are returned.
        in: query
        required: false
        schema: {type: integer, minimum: 0, maximum: 999, example: 0}
      - name: status
        description: Notification send status filter supporting multiple entries.
        in: query
        required: false
        schema:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/NotifyStatus'}
        style: form
        explode: false
      - name: externalId
        description: External ID
        in: query
        required: false
        schema: {type: string}
      - name: page
        description: Page number, starts from zero.
        in: query
        required: false
        schema: {type: integer}
      - name: size
        description: Page size
        in: query
        required: false
        schema: {type: integer}
      - name: sort
        description: 'A comma separated list of sortable properties, each item must
          have format: property-name:order. Order can be asc or desc. Available property
          names: status, externalId, created. Default value is created:desc.'
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmergencyNotificationLog'}
          headers:
            http-x-request-id: {$ref: '#/components/headers/http-x-request-id'}
        '400': {$ref: '#/components/responses/BadRequestApiResponse'}
        '403': {$ref: '#/components/responses/UnauthorizedApiResponse'}
        '404': {$ref: '#/components/responses/NotFoundApiResponse'}
        '500': {$ref: '#/components/responses/InternalErrorApiResponse'}
