        required: false
        schema: {$ref: '#/components/schemas/OperationType'}
      - name: serviceName
        description: Service name. Optional parameter.
        in: query
        required: false
        schema: {$ref: '#/components/schemas/ServiceName'}
      - name: participantName
        description: The participant name associated with the transaction.
        in: path
        required: true
        schema: {type: string}
      - name: submitterName
        description: User name. Optional parameter.
        in: query
        required: false
        schema: {type: string}
