      type: string
      enum: [portal-governor, mgms, notification, mps]
    TransactionEvent:
      description: Transaction event.
      type: object
      properties:
        mrid: {type: string, format: uuid}
        transactionId: {type: string, format: guid}
        eventTime: {type: string}
        operationType: {$ref: '#/components/schemas/OperationType'}
        transactionState: {$ref: '#/components/schemas/TransactionStateType'}
        processingTime: {type: number}
        serviceName: {$ref: '#/components/schemas/ServiceName'}
