        description: Transaction Id. Optional parameter.
        in: query
        required: false
        schema: {type: string, format: guid}
  /mgms/transactions/events/mrid/{mrid}/payloads:
    description: Returns one or more payload documents for transaction event specified
      by the internal Transaction Event unique identifier(UUID).
    get:
      tags: [Transactions]
      description: Returns one or more payload documents for transaction event specified
        by the internal Transaction Event unique identifier(UUID).
      operationId: getTransactionEventPayloads
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionEventPayloads'}
          headers:
            http-x-request-id: {$ref: '#/components/headers/http-x-request-id'}
        '400': {$ref: '#/components/responses/BadRequestApiResponse'}
        '403': {$ref: '#/components/responses/UnauthorizedApiResponse'}
        '404': {$ref: '#/components/responses/NotFoundApiResponse'}
        '500': {$ref: '#/components/responses/InternalErrorApiResponse'}
      parameters:
      - name: mrid
        description: The internal Transaction UUID identifies a specific transaction
          event item.
        in: path
        required: true
        schema: {type: string}
  /mgms/transactions/events/mrid/{mrid}/payloads/payload-type/{payloadType}:
    description: Returns payload documents for transaction event specified by the
      internal Transaction Event unique identifier(UUID) and specified payload type.
    get:
      tags: [Transactions]
      description: Returns payload documents for transaction event specified by the
        internal Transaction Event unique identifier(UUID) and specified payload type.
      operationId: getTransactionEventPayload
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionEventPayload'}
          headers:
            http-x-request-id: {$ref: '#/components/headers/http-x-request-id'}
        '400': {$ref: '#/components/responses/BadRequestApiResponse'}
        '403': {$ref: '#/components/responses/UnauthorizedApiResponse'}
        '404': {$ref: '#/components/responses/NotFoundApiResponse'}
        '500': {$ref: '#/components/responses/InternalErrorApiResponse'}
      parameters:
      - name: mrid
        description: The internal Transaction UUID identifies a specific transaction
          event item.
        in: path
        required: true
        schema: {type: string}
      - name: payloadType
        description: specific payload document type.
        in: path
        required: true
        schema: {$ref: '#/components/schemas/PayloadDocumentType'}
components:
  schemas:
    APIResponse:
      description: General container for API response.
      type: object
      properties:
        action:
          description: A general action code summary of the result. HTTP status codes
            will be applied that match. These indicate the type of operation that
            was done (or not). Note, some APIs use REST verbiage like created/updated/deleted
            while others use submit/query.
          enum: [CREATED, UPDATED, DELETED, CREATE_FAILED, UPDATE_FAILED, DELETE_FAILED,
            GET_FAILED, SUBMITTED, SUBMIT_FAILED, QUERY, QUERY_FAILED]
        responses:
          description: List of responses in case multiple resources are modified,
            or general errors that are not resource specific.
          type: array
          minItems: 0
          items:
            description: A single response which may contain multiple messages, both
              error and warning, per response.
            type: object
            properties:
              messages:
                description: List of warnings and errors resulting from the command.
                type: array
                minItems: 0
                items:
                  description: An individual warning or error message.  Designed to
                    be either localized or categorized as an event.
                  type: object
                  properties:
                    level:
                      description: An indication of severity of the message.
                      type: string
                      enum: [ERROR, WARNING, INFO]
                    msgId: {description: 'A categorized ID for this message, identifying
                        it as a particular type of event. Useful for checking for
                        specific errors, or localization.', type: string}
                    params:
                      description: Ordered list of parameter values for the message.
                      type: array
                      items: {type: string}
                    userMsg: {description: 'The message, fully rendered in the default
                        locale on the service side.', type: string}
        transactionId: {description: Unique identifier for the transaction which can
            be queried at a later date. Identifier is a GUID represented without hyphens.
            Only returned for submissions and errors though all calls generate a transaction
            ID that is returned in the http-x-request-id response header., type: string,
          format: guid}
        transactionTime: {description: The time at which the transaction was received
            by the system., type: string, format: date-time}
    HourLabel: {description: Hour ending label. Represents an hour segment of time.,
      type: integer, minimum: 1, maximum: 24, example: 1}
    CheckHourLabel: {description: Hour ending label that can be provided to enable
        a validation on the current hour during submission. If specified then current
        hour must equal this value otherwise a validation error is raised., type: integer,
      minimum: 1, maximum: 24, example: 1}
    MarketOperatingDay: {description: Effective Market operating day of data. RFC
        3339. 'YYYY-MM-DD'., type: string, format: date, example: '2019-03-14'}
    MarketOperatingDayNullable: {description: Effective Market operating day of data.
        RFC 3339. 'YYYY-MM-DD'., type: string, nullable: true, format: date, example: '2019-03-14'}
    MarketIntervalLabel: {description: 'Date-time as defined in RFC 3339. ''YYYY-MM-DDTHH:MM:SS-05:00''.
        Effective Market interval of data.', type: string, format: date-time, example: '2019-03-14T14:50:00-05:00'}
    MarketIntervalLabelNullable: {description: 'Date-time as defined in RFC 3339.
        ''YYYY-MM-DDTHH:MM:SS-05:00''. Effective Market interval of data with null
        indicating unset.', type: string, nullable: true, format: date-time, example: '2019-03-14T14:50:00-05:00'}
    RealEnergy: {description: Used to represent real energy values submitted to the
        market., type: number, format: realenergy, multipleOf: 0.1, minimum: -9.99999999E7,
      maximum: 9.99999999E7, example: 1200.7}
    RealEnergyNullable: {description: Used to represent real energy values submitted
        to the market. Nullable added to allow for data driven delete behaviour.,
      type: number, nullable: true, format: realenergy, multipleOf: 0.1, minimum: -9.99999999E7,
      maximum: 9.99999999E7, example: 1200.7}
    RealEnergySigned: {description: Used to represent real energy values submitted
        to the market., type: number, format: realenergy, multipleOf: 0.1, minimum: 0,
      maximum: 9.99999999E7, example: 1200.7}
    RealEnergySignedNullable: {description: Used to represent real energy values submitted
        to the market. Nullable added to allow for data driven delete behaviour.,
      type: number, nullable: true, format: realenergy, multipleOf: 0.1, minimum: 0,
      maximum: 9.99999999E7, example: 1200.7}
    RealEnergyNegative: {description: Used to represent real energy values submitted
        to the market that must be less than or equal to zero., type: number, format: realenergy,
      multipleOf: 0.1, minimum: -9.99999999E7, maximum: 0, example: -1200.7}
    RealEnergyNegativeNullable: {description: Used to represent real energy values
        submitted to the market that must be less than or equal to zero. Nullable
        added to allow for data driven delete behaviour., type: number, nullable: true,
      format: realenergy, multipleOf: 0.1, minimum: -9.99999999E7, maximum: 0, example: -1200.7}
    RealEnergyResults: {description: Used to represent real energy values in market
        outcomes. Historically simliar to 'MWType'., type: number, format: realenergy,
      multipleOf: 0.1, minimum: -9.99999999E7, maximum: 9.99999999E7, example: 120001.7}
    RealEnergyResultsNullable: {description: Used to represent real energy values
        in market outcomes. Historically simliar to 'MWType'., type: number, nullable: true,
