      description: Collection of transaction event payloads.
      type: array
      items: {$ref: '#/components/schemas/TransactionEventPayload'}
  parameters:
    x-acting-participant:
      in: header
      name: x-acting-participant
      description: Header to override default acting participant of NERC ID. Will
        be validated against participant collection resource when specified in path.
      schema: {type: string}
      example: MP
    MarketType:
      in: path
      name: market
      description: Energy Market (day-ahead, real-time).
      required: true
      schema: {$ref: '#/components/schemas/MarketType'}
    MarketTypeIncBoth:
      in: path
      name: market
      description: Energy Market or both (day-ahead, real-time, or both).
      required: true
      schema: {$ref: '#/components/schemas/MarketTypeIncBoth'}
    MarketOperatingDay:
      in: path
      name: day
      description: The operating day of the data.
      required: true
      schema: {$ref: '#/components/schemas/MarketOperatingDay'}
    Participant:
      in: path
      name: participantName
      description: The NERC ID of asset owner specified in the path for a collection
        resource.
      required: true
      schema: {$ref: '#/components/schemas/ParticipantName'}
    Pnode:
      in: query
      name: pnode
      description: Optional parameter to specify the name of a pricing node for the
        requested data. If neither pnode or portfolio is provided then all applicable
        data is returned.
      required: false
      schema: {$ref: '#/components/schemas/PNodeName'}
    PnodeRequired:
      in: query
      name: pnode
      description: Required parameter to specify the name of a pricing node for the
        requested data.
      required: true
      schema: {$ref: '#/components/schemas/PNodeName'}
    Portfolio:
      in: query
      name: portfolio
      description: Optional parameter to specify the name of the Portfolio of pricing
        nodes for the requested data.  If neither pnode or portfolio is provided then
        all applicable data is returned.
      required: false
      schema: {$ref: '#/components/schemas/PortfolioName'}
    LocationType:
      in: query
      name: locationType
      required: false
      schema:
        type: array
        minItems: 1
        items: {$ref: '#/components/schemas/LocationType'}
      style: form
      explode: false
    Hour:
      in: query
      name: hour
      description: Optional parameter to specifiy the particular hour to be returned,
        otherwise all hours are returned.
      required: false
      schema: {$ref: '#/components/schemas/HourLabel'}
