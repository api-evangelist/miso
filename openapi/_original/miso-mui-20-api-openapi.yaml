      enum: [Name, Type]
      example: Name
    ContextFilter:
      description: Context filter for the report.
      type: string
      enum: [System, Portfolio, FinSched, Supply, DemandBid, VirtualBid, VirtualOffer,
        Lmp]
      example: System
    ZonalDemandCurveType:
      description: Type of zonal demand curve.
      type: string
      enum: [Operating, Regulation, Regulation-Spinning]
      example: Operating
    MarketWideDemandCurveType:
      description: Type of market wide demand curve.
      type: string
      enum: [Operating, Regulation, Regulation-Spinning, RampCapability-Up, RampCapability-Down,
        ShortTermReserve]
      example: Operating
    ContractType:
      description: The type of contract established between two participants.
      type: string
      enum: [PureFinancial, GrandFathered, PseudoTie]
    ScheduleApprovalType:
      description: The type of approval required for the contract.
      type: string
      enum: [SellerAutoApproval, BuyerAutoApproval, CounterpartyApproval]
    CongestionLossesType:
      description: The type of loss for the contract.
      type: string
      nullable: true
      enum: [SellerPays, BuyerPays, null]
    SettlementMarketType:
      description: The type of settlement the market will use to handle the contract.
      type: string
      enum: [day-ahead, real-time]
    NotifyStatus:
      description: Notification send status.
      type: string
      enum: [SENT, GENERATED, GENERATION_FAILED, RETRYING, SEND_FAILED, EXPIRED, REQUEST_TIMEOUT]
    StudyStatus:
      description: The status of the reserve zone study for a given market day.
      type: string
      enum: [Complete, Incomplete]
    DemandCurveSegments:
      description: Demand curve segments.
      type: array
      items:
        type: object
        properties:
          mw: {$ref: '#/components/schemas/RealEnergyDemandCurve'}
          price: {$ref: '#/components/schemas/MarketPrice'}
        required: [mw, price]
    CaseEvent:
      description: An event to publish to kafka.
      properties:
        caseId: {type: string, pattern: '^\d+(.\d{1})?$'}
        iteration: {type: integer, minimum: 0}
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        interval: {$ref: '#/components/schemas/MarketIntervalLabelNullable'}
        approvedTime: {$ref: '#/components/schemas/MarketIntervalLabelNullable'}
        studyModeId: {type: integer, minimum: 0}
        eventType:
          type: string
          enum: [CaseSolved, CaseApproved]
        solvedTime: {$ref: '#/components/schemas/MarketIntervalLabelNullable'}
      required: [caseId, iteration, day, studyModeId, eventType]
    CaseMitigationStatus:
      description: IMM mitigation status.
      properties:
        caseId: {type: string}
        day: {type: string}
        mitigationStatus: {$ref: '#/components/schemas/MitigationStatus'}
      required: [mitigationStatus, caseId, day]
    MitigationStatus:
      description: Specifies whether analysis is complete with no mitigation or whether
        mitigation schedule(s) were activated. Null will be returned for queries before
        it is first populated, but is not valid for submission.
      type: string
      nullable: true
      enum: [Mitigated, Completed, null]
      example: Mitigated
    MitigationSupply:
      description: Mitigation Supply
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        resources:
          type: array
          nullable: true
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              dayAheadSourceSchedules:
                type: array
                nullable: true
                items:
                  type: object
                  properties:
                    scheduleId: {type: integer}
                    mitigatedSets:
                      type: array
                      items:
                        type: string
                        enum: [EnergyOffer, RegulationOffer, SpinningOffer, OnlineSupplementalOffer,
                          OfflineSupplementalOffer, OfflineShortTermReserveOffer,
                          OfferStartupCosts, OfferNoLoadCosts, CommitStatusOffer,
                          UnitLimitsOffer, RampRatesOffer]
              realTimeSourceSchedules:
                type: array
                nullable: true
                items:
                  type: object
                  properties:
                    scheduleId: {type: integer}
                    start: {type: string}
                    end: {type: string}
                    mitigatedSets:
                      type: array
                      items:
                        type: string
                        enum: [EnergyOffer, RegulationOffer, SpinningOffer, OnlineSupplementalOffer,
                          OfflineSupplementalOffer, OfflineShortTermReserveOffer,
                          OfferStartupCosts, OfferNoLoadCosts, CommitStatusOffer,
                          UnitLimitsOffer, RampRatesOffer]
      required: [day, resources]
    VerificationStatus:
      description: Specifies whether a schedule verification has been completed or
        that it requires verification for the Day-Ahead or Real-Time markets
      type: string
      nullable: true
      enum: [Verified, Completed, null]
      example: Verified
    DayVerificationStatus:
      description: Verification status
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        market: {$ref: '#/components/schemas/MarketType'}
        verificationStatus: {$ref: '#/components/schemas/VerificationStatus'}
        verificationStatusHourly:
          type: array
          description: Verification status hourly objects are only valid for Real-Time
            market submissions
          nullable: true
          items:
            type: object
            properties:
              hour: {$ref: '#/components/schemas/HourLabel'}
              verificationStatus: {$ref: '#/components/schemas/VerificationStatus'}
            required: [hour]
      required: [day, market]
    IMMVirtualRestrictions:
      description: IMM Virtual Restrictions.
      type: object
      properties:
        virtualRestrictions:
          type: array
          nullable: false
          items:
            type: object
            properties:
              id: {type: integer, example: 101}
              type:
                type: string
                enum: [Bid, Offer]
                example: Bid
              participantName: {type: string, example: MP1}
              startDay: {$ref: '#/components/schemas/MarketOperatingDay'}
              endDay: {$ref: '#/components/schemas/MarketOperatingDay'}
              restrictedLocations:
                type: array
                nullable: true
                minItems: 1
                items: {type: string, example: PNODE1}
              virtualLimitsHourly:
                type: array
                nullable: true
                minItems: 1
                maxItems: 24
                items:
                  type: object
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    mw: {$ref: '#/components/schemas/RealEnergyResults'}
            required: [restrictedLocations, virtualLimitsHourly]
      required: [virtualRestrictions]
    DayAheadLmpExAnte:
      description: A LMP Ex-Ante report from the Day-Ahead market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        priceType: {$ref: '#/components/schemas/PriceTypeExAnte'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              hours:
                type: array
                items:
                  type: object
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    lmp: {$ref: '#/components/schemas/MarketPriceResults'}
                    mcc: {$ref: '#/components/schemas/MarketPriceResults'}
                    mlc: {$ref: '#/components/schemas/MarketPriceResults'}
                    regMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    spinMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    suppMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    strMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    rcUpMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    rcDownMcp: {$ref: '#/components/schemas/MarketPriceResults'}
      required: [day, priceType]
    DayAheadLmpExPost:
      description: A LMP Ex-Post report from the Day-Ahead market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        priceType: {$ref: '#/components/schemas/PriceTypeExPost'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              hours:
                type: array
                items:
                  type: object
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    lmp: {$ref: '#/components/schemas/MarketPriceResults'}
                    mcc: {$ref: '#/components/schemas/MarketPriceResults'}
                    mlc: {$ref: '#/components/schemas/MarketPriceResults'}
                    regMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    spinMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    suppMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    strMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    rcUpMcp: {$ref: '#/components/schemas/MarketPriceResults'}
                    rcDownMcp: {$ref: '#/components/schemas/MarketPriceResults'}
      required: [day, priceType]
    DemandBids:
      description: Collection of Demand Bids for the market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        pnodes:
          description: Collection of pnodes.
          type: array
          minItems: 0
          items:
            description: A resource can have both fixedBids and/or pricesenstivieBids.
              Submitting null fixedBids or priceSensitiveBids properties will delete
              the existing object.
            type: object
            additionalProperties: false
            minProperties: 2
            maxProperties: 3
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              fixedBids:
                description: Hourly fixed price demand bid. Submitted null MW values
                  effectively deletes the bid for the hour.
                type: array
                nullable: true
                minItems: 0
                maxItems: 24
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    fixedMw: {$ref: '#/components/schemas/RealEnergyNullable'}
                  required: [hour, fixedMw]
              priceSensitiveBids:
                description: Price sensitive demand bid curves.
                type: array
                nullable: true
                minItems: 0
                maxItems: 24
                items:
                  description: Hourly price sensitive demand bid curve.
                  type: object
                  additionalProperties: false
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    demandBidSegments:
                      description: Bid segements making up the demand bid curve. MW's
                        and price cap. Sumbitted null array effectively deletes the
                        bid for the hour.
                      type: array
                      nullable: true
                      items:
                        type: object
                        properties:
                          price: {$ref: '#/components/schemas/MarketPrice'}
                          mw: {$ref: '#/components/schemas/RealEnergyNullable'}
                        required: [price, mw]
                      minItems: 0
                      maxItems: 9
                  required: [hour, demandBidSegments]
            required: [pnodeName]
      required: [day, pnodes]
    VirtualBidsAndOffers:
      description: Collection of virtual generation offers and virtual demand bids
        for the market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        pnodes:
          description: Collection of pnodes.
          type: array
          minItems: 0
          items:
            description: A resource can have virtual bids and/or virtual offers. Submitted
              null virtualBids or virtualOffers properties will delete the existing
              object.
            type: object
            additionalProperties: false
            minProperties: 2
            maxProperties: 3
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              virtualBids: {$ref: '#/components/schemas/VirtualBidOrOfferHourly'}
              virtualOffers: {$ref: '#/components/schemas/VirtualBidOrOfferHourly'}
            required: [pnodeName]
      required: [day, pnodes]
    VirtualBidOrOfferHourly:
      description: This object is used both virtual demand bids and virtual generation
        offers since the structure is the same.
      type: array
      nullable: true
      items:
        description: Hourly bid or offer curve.
        type: object
        additionalProperties: false
        properties:
          hour: {$ref: '#/components/schemas/HourLabel'}
          virtualBidSegments:
            description: Segements making up the bid or offer curve. MW/price pairs.
              Sumbitted null array effectively deletes the curve for the hour.
            type: array
            nullable: true
            items:
              type: object
              additionalProperties: false
              properties:
                price: {$ref: '#/components/schemas/MarketPrice'}
                mw: {$ref: '#/components/schemas/RealEnergy'}
              required: [price, mw]
            minItems: 0
            maxItems: 9
        required: [hour, virtualBidSegments]
      minItems: 0
      maxItems: 24
    LFHourly:
      description: Load Forecast report for the Day-Ahead market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        controlAreas:
          description: Collection of Control Areas.
          type: array
          items:
            description: Control Area.
            type: object
            properties:
              areaName: {description: Name of the local balancing authority or label
                  for MISO total., type: string, example: Area1}
              hours:
                type: array
                items:
                  type: object
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    mw: {$ref: '#/components/schemas/RealEnergyResults'}
                minItems: 1
                maxItems: 24
            required: [areaName, hours]
      required: [day]
    MultiVariantRampRateCurves:
      description: Multi-variant Ramp Rate Curves.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        resources:
          description: Collection of resources refernced via pnodeName.
          type: array
          minItems: 1
          items:
            description: Resource which has offered in a ramp rate curve.
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              offers:
                type: array
                minItems: 1
                items:
                  oneOf:
                  - {$ref: '#/components/schemas/RampRateCurveItem'}
                  - {$ref: '#/components/schemas/ESRRampRateCurveItem'}
            required: [pnodeName, offers]
            additionalProperties: false
      required: [day, resources]
    RampRateCurveItem:
      type: object
      properties:
        offerType:
          type: string
          enum: [rampCurve]
          example: rampCurve
        rampRateCurves:
          description: Hourly ramp rate curves. Including a null collection will act
            as a data driven delete.
          type: array
          minItems: 0
          maxItems: 24
          nullable: true
          items:
            type: object
            properties:
              hour: {$ref: '#/components/schemas/HourLabel'}
              rampRateCurve:
                description: Ramp Rate Curve segments. Including a null collection
                  will act as a data driven delete.
                type: array
                minItems: 0
                maxItems: 10
                nullable: true
                items:
                  type: object
                  description: Set of ramp rates for a given MW level.
                  properties:
                    mw: {$ref: '#/components/schemas/RealEnergy'}
                    rampRateUp: {$ref: '#/components/schemas/MWRampRate'}
                    rampRateDown: {$ref: '#/components/schemas/MWRampRate'}
                    rampRateBidirectional: {$ref: '#/components/schemas/MWRampRate'}
                  required: [mw, rampRateUp, rampRateDown, rampRateBidirectional]
            required: [hour, rampRateCurve]
            additionalProperties: false
      required: [offerType, rampRateCurves]
    ESRRampRateCurveItem:
      type: object
      properties:
        offerType:
          type: string
          enum: [esrRampCurve]
          example: esrRampCurve
        rampRateCurves:
          description: Hourly ramp rate curves. Including a null collection will act
            as a data driven delete.
          type: array
          minItems: 0
          maxItems: 24
          nullable: true
          items:
            type: object
            properties:
              hour: {$ref: '#/components/schemas/HourLabel'}
              rampRateCurve:
                description: Ramp Rate Curve segments. Including a null collection
                  will act as a data driven delete.
                type: array
                minItems: 0
                maxItems: 10
                nullable: true
                items:
                  type: object
                  description: Set of ramp rates for a given MW level. All of the
                    ramp rates must be included.
                  properties:
                    mw: {$ref: '#/components/schemas/RealEnergy'}
                    chargeRampRate: {$ref: '#/components/schemas/MWRampRate'}
                    dischargeRampRate: {$ref: '#/components/schemas/MWRampRate'}
                  required: [mw, chargeRampRate, dischargeRampRate]
            required: [hour, rampRateCurve]
            additionalProperties: false
      required: [offerType, rampRateCurves]
    RealTimeIntvlLmp:
      description: RT LMP data for an interval
      type: object
      properties:
        interval5: {$ref: '#/components/schemas/MarketIntervalLabel'}
        lmp: {$ref: '#/components/schemas/MarketPriceResults'}
        mcc: {$ref: '#/components/schemas/MarketPriceResults'}
        mlc: {$ref: '#/components/schemas/MarketPriceResults'}
        regMcp: {$ref: '#/components/schemas/MarketPriceResults'}
        regMileageMcp: {$ref: '#/components/schemas/MarketPriceResults'}
        spinMcp: {$ref: '#/components/schemas/MarketPriceResults'}
        suppMcp: {$ref: '#/components/schemas/MarketPriceResults'}
        strMcp: {$ref: '#/components/schemas/MarketPriceResults'}
        rcUpMcp: {$ref: '#/components/schemas/MarketPriceResults'}
        rcDownMcp: {$ref: '#/components/schemas/MarketPriceResults'}
      required: [interval5, lmp, mcc, mlc]
    RealTimeLmpExAnte:
      description: A LMP Ex-Ante report from the Real-Time market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        priceType: {$ref: '#/components/schemas/PriceTypeExAnte'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          minItems: 0
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              interval5s:
                type: array
                minItems: 0
                maxItems: 288
                items: {$ref: '#/components/schemas/RealTimeIntvlLmp'}
            required: [pnodeName, interval5s]
      required: [day, priceType, pnodes]
    RealTimeLmpExPost:
      description: A LMP Ex-Post report from the Real-Time market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        priceType: {$ref: '#/components/schemas/PriceTypeExPost'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          minItems: 0
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              interval5s:
                type: array
                minItems: 0
                maxItems: 288
                items: {$ref: '#/components/schemas/RealTimeIntvlLmp'}
            required: [pnodeName, interval5s]
      required: [day, priceType, pnodes]
    RealTimeIntegratedLmpExPost:
      description: A hourly LMP integrated prices report from the Real-Time market.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        priceType: {$ref: '#/components/schemas/PriceTypeExPost'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              hours:
                type: array
                description: Integrated market prices at the pnode, for the period.
                items:
                  type: object
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    lmp: {$ref: '#/components/schemas/MarketPriceResults'}
                    mcc: {$ref: '#/components/schemas/MarketPriceResults'}
                    mlc: {$ref: '#/components/schemas/MarketPriceResults'}
      required: [day, priceType, pnodes]
    PNodeList:
      description: List of active pnodes.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDayNullable'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              pnodeType: {type: string, example: A}
      required: [day, pnodes]
    ParticipantMetadata:
      description: MUI and participant metadata.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        participantControlAreas:
          description: Control Areas administered by a particular participant.
          type: array
          items:
            type: object
            properties:
              areaShortName: {type: string, example: Area1}
              internalArea: {type: boolean, example: true}
      required: [day, participantControlAreas]
    RetrievedPortfolios:
      description: A list of portfolios.
      type: array
      items:
        description: A single retrieved portfolio. Each portfolio is a named association
          of resource pricing node (pnode) locations. A portfolio can contain resource
          pnode locations for generator units, demand response resources, and other
          pnodes. Can include additional metadata about the pnode depending on query
          parameters provided.
        type: object
        properties:
          name: {$ref: '#/components/schemas/PortfolioName'}
          portfolioLocations:
            description: Participant pnodes.
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/PNodeName'}
                pnodeType:
                  type: string
                  enum: [Aggregate, Bus, Hub, Interface, Zone, 500 KV]
                virtualIncBidsAllowed: {type: boolean, example: true}
                virtualDecBidsAllowed: {type: boolean, example: true}
                unitOfferType:
                  type: string
                  enum: [GEN, DIR, DRR1, DRR2, EAR, ESR, SER, NA]
                intermittentStatus:
                  type: string
                  enum: [Dispatchable, Intermittent, Non-Intermittent, NA]
        required: [name, portfolioLocations]
    Portfolio:
      description: A single submitted portfolio. Each portfolio is a named association
        of resource pricing node (pnode) locations. A portfolio can contain resource
        pnode locations for generator units, demand response resources, and other
        pnodes.
      type: object
      properties:
        name: {$ref: '#/components/schemas/PortfolioName'}
        portfolioLocations:
          description: A list of pnodes identified by name.
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            properties:
              name: {$ref: '#/components/schemas/PNodeName'}
      required: [name, portfolioLocations]
    DayAheadLocationalResults:
      description: Day-ahead locational results.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        pnodes:
          description: Pricing nodes in the report.
          type: array
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              hours:
                type: array
                items:
                  type: object
                  properties:
                    hour: {$ref: '#/components/schemas/HourLabel'}
                    clearedEnergy:
                      type: object
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        virtualMw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
                        capped: {type: boolean, example: false}
                    clearedRegulation:
                      type: object
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
                        capped: {type: boolean, example: false}
                    clearedSpin:
                      type: object
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
                        capped: {type: boolean, example: false}
                    clearedSupplemental:
                      type: object
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
                        capped: {type: boolean, example: false}
                    clearedShortTerm:
                      type: object
                      nullable: true
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
                        capped: {type: boolean, example: false}
                    clearedRampCapabilityUp:
                      type: object
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
                    clearedRampCapabilityDown:
                      type: object
                      properties:
                        mw: {$ref: '#/components/schemas/RealEnergyResults'}
                        price: {$ref: '#/components/schemas/MarketPriceResults'}
      required: [day, pnodes]
    DistributionFactors:
      description: All distribution factors, filtered by query params.
      type: object
      properties:
        day: {type: string, example: '2019-03-14'}
        aggregatePnodes:
          description: A pnode at which load from other pnodes is aggregated to for
            repsentation in the market.
          type: array
          items:
            type: object
            properties:
              pnodeName: {$ref: '#/components/schemas/PNodeName'}
              busPnodes:
                description: Bus pnode for a particular pnode.
                type: array
                items:
                  type: object
                  properties:
                    pnodeName: {$ref: '#/components/schemas/PNodeName'}
                    factor: {type: number, example: 0.17468}
                  required: [pnodeName, factor]
      required: [day, aggregatePnodes]
    DayAheadMarketWideResults:
      description: Hourly Day-Ahead summary of market wide results.
      type: object
      properties:
        day: {$ref: '#/components/schemas/MarketOperatingDay'}
        hours:
          type: array
          minItems: 0
          maxItems: 24
          nullable: true
          items:
            type: object
            properties:
              hour: {$ref: '#/components/schemas/HourLabel'}
              forecastMw: {$ref: '#/components/schemas/RealEnergyResults'}
              energyMw: {$ref: '#/components/schemas/RealEnergyResults'}
              regulationMw: {$ref: '#/components/schemas/RealEnergyResults'}
              spinningReserveMw: {$ref: '#/components/schemas/RealEnergyResults'}
              supplementalReserveMw: {$ref: '#/components/schemas/RealEnergyResults'}
              shortTermReserveMw: {$ref: '#/components/schemas/RealEnergyResults'}
              rampCapabilityUpMw: {$ref: '#/components/schemas/RealEnergyResults'}
              rampCapabilityDownMw: {$ref: '#/components/schemas/RealEnergyResults'}
