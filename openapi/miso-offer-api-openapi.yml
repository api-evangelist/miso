      required: true
      schema:
        $ref: '#/components/schemas/MarketOperatingDay'
    LocationType:
      in: query
      name: locationType
      required: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/LocationType'
      style: form
      explode: false
