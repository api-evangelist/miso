components:
  schemas:
    NetActualInterchange:
      type: object
      properties:
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        adjacentBa:
          type: string
        nai:
          type: number
    RealTimeGenerationFuelMargin:
      type: object
      properties:
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        peak:
          type: boolean
        region:
          $ref: '#/components/schemas/Region'
        fuelType:
          type: string
        unitCount:
          type: integer
          format: int32
    TimeInterval:
      type: object
      properties:
        resolution:
          enum:
          - 5min
          - hourly
          - daily
          type: string
          example: daily
        start:
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2}) ([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{3})
          type: string
          description: In Eastern Standard Time (UTC−05:00).
          example: '2023-06-28 00:00:00.000'
        end:
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2}) ([0-9]{2}):([0-9]{2}):([0-9]{2}).([0-9]{3})
          type: string
          description: In Eastern Standard Time (UTC−05:00).
          example: '2023-06-29 00:00:00.000'
        value:
          type: string
          description: 'Short hand value for time interval. Can be timestamp for 5min resolution (ex: 2023-06-28 00:00:00.000), hour ending value for hourly resolution, 1-24 (ex: 21), or date string for daily (ex: 2023-06-28). In Eastern Standard Time (UTC−05:00).'
          example: '2023-06-29'
    PreliminaryFinalEnum:
      enum:
      - Preliminary
      - Final
      type: string
    200-OK-Demand-EstResponse-json:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DemandEst'
        page:
          $ref: '#/components/schemas/PageInfo'
      x-apim-inline: true
    200-OK-RealTime-DemandResponse-json:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RealTimeDemand'
        page:
          $ref: '#/components/schemas/PageInfo'
      x-apim-inline: true
    RealTimeOutage:
      type: object
      properties:
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        realTime:
          type: number
          description: The approved (planned) outages (in megawatts) used in the real-time market.
        forward:
          type: number
          description: The approved (planned) outages (in megawatts) used in the Forward Reliability Assessment & Commitment (FRAC) process.
        delta:
          type: number
          description: The difference between the forward and real-time values.
        interval:
          type: string
    GenerationFuelType:
      type: object
      properties:
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        region:
          $ref: '#/components/schemas/Region'
        fuelTypes:
          $ref: '#/components/schemas/FuelType'
        totalMw:
          type: number
        interval:
          type: string
    GenerationCleared:
      type: object
      properties:
        generation:
          type: number
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
    200-OK-Gen-ClearedResponse-json:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GenerationCleared'
        page:
          $ref: '#/components/schemas/PageInfo'
      x-apim-inline: true
    CommittedGeneration:
      type: object
      properties:
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        committedForwardEcoMax:
          type: number
          description: The economic maximum (in megawatts) for all units committed in the Forward Reliability Assessment & Commitment (FRAC) process.
        committedRealTimeEcoMax:
          type: number
          description: The economic maximum (in megawatts) for all units committed in the real-time market, based on the peak case within the hour.
        committedEcoMaxDelta:
          type: number
          description: The difference between the forward and real-time values.
    200-OK-LMPResponse-json:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LocationalMarginalPrice'
        page:
          $ref: '#/components/schemas/PageInfo'
      x-apim-inline: true
    200-OK-RTMCPResponse-json:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RealTimeExPostMarketClearingPrice'
        page:
          $ref: '#/components/schemas/PageInfo'
      x-apim-inline: true
    RealTimeNetScheduledInterchange:
      type: object
      properties:
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        nsiForward:
          type: number
          description: The net scheduled interchange (in megawatts) as used in the Forward Reliability Assessment Commitment (FRAC) process.
        nsiRealTime:
          type: number
          description: The net scheduled interchange (in megawatts) as used in the real-time market.
        nsiDelta:
          type: number
          description: The difference between the forward and real-time values.
    PageInfo:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        lastPage:
          type: boolean
    LocationalMarginalPrice:
