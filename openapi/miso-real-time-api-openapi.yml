openapi: 3.2.0
info:
  title: Miso Real Time API
  version: '1.0'
  description: 'Operations tagged Real Time across 2 of this provider''s published API definitions: miso-data-exchange-load-generation-interchange-api-openapi.json, miso-data-exchange-pricing-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apim.misoenergy.org/lgi
- url: https://apim.misoenergy.org/pricing
security:
- {}
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Real Time
paths:
  /v1/real-time/{date}/binding-constraint:
    servers:
    - url: https://apim.misoenergy.org/lgi
    get:
      operationId: get-v1-real-time-date-binding-constraint
      summary: Real-Time Binding Constraints
      description: The total number of binding constraints in the real-time market, in hourly intervals. Available at 7am EST the day after.
      parameters:
      - name: date
        in: path
        required: true
        description: 'Market date in the form: yyyy-mm-dd'
        schema:
          type: string
          format: date
      - name: interval
        in: query
        required: false
        description: Filter to a specific time interval (ex. "13:05", "13"), in Eastern Standard Time (UTC−05:00).
        schema:
          type: string
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-OK-Real-Time-BindingConstraintsResponse-json'
              example:
                data:
                - timeInterval:
                    resolution: daily
                    start: '2023-06-28 00:00:00.000'
                    end: '2023-06-29 00:00:00.000'
                    value: '2023-06-29'
                  constraintCount: 0
                  interval: string
                page:
                  pageNumber: 0
                  pageSize: 0
                  totalElements: 0
                  totalPages: 0
                  lastPage: true
        '400':
          description: Invalid date format
          content:
            application/json: {}
        '401':
          description: Invalid or missing Bearer Token in the Authorization header
          content:
            application/json: {}
        '404':
          description: Date not found
          content:
            application/json: {}
      tags:
      - Real Time
  /v1/real-time/{date}/demand/actual:
    servers:
    - url: https://apim.misoenergy.org/lgi
    get:
      operationId: get-v1-real-time-date-demand-actual
      summary: Actual Load
      description: Actual load (in megawatt-hours) as used in the real-time market, by region or grouped local resource zones (LRZ) in hourly or daily intervals. Available at 2am EST the day after.
      parameters:
      - name: date
        in: path
        required: true
        description: 'Market date in the form: yyyy-mm-dd'
        schema:
          type: string
          format: date
      - name: geoResolution
        in: query
        required: false
        description: Geographic resolution of data
        schema:
          type: string
          enum:
          - region
          - localResourceZone
          default: region
      - name: interval
        in: query
        required: false
        description: Filter to a specific time interval (ex. "13:05", "13"), in Eastern Standard Time (UTC−05:00).
        schema:
          type: string
      - name: localResourceZone
        in: query
        required: false
        schema:
          type: string
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: region
        in: query
        required: false
        schema:
          type: string
          enum:
          - NORTH
          - CENTRAL
          - SOUTH
          - MISO
          - NO_REGION
      - name: timeResolution
        in: query
        required: false
        description: Time resolution of data
        schema:
          type: string
          enum:
          - hourly
          - daily
          default: hourly
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-OK-LoadResponse-json'
        '400':
          description: Invalid date format
          content:
            application/json: {}
        '401':
          description: Invalid or missing Bearer Token in the Authorization header
          content:
            application/json: {}
        '404':
          description: Date not found
          content:
            application/json: {}
      tags:
      - Real Time
  /v1/real-time/{date}/demand/forecast:
    servers:
    - url: https://apim.misoenergy.org/lgi
    get:
      operationId: get-v1-real-time-date-demand-forecast
      summary: Real-Time Cleared Demand
      description: Demand cleared (in megawatts) in the real-time market, in hourly or daily intervals. Available at 7am EST the day after.
      parameters:
      - name: date
        in: path
        required: true
        description: 'Market date in the form: yyyy-mm-dd'
        schema:
          type: string
          format: date
      - name: interval
        in: query
        required: false
        description: Filter to a specific time interval (ex. "13:05", "13"), in Eastern Standard Time (UTC−05:00).
        schema:
          type: string
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: timeResolution
        in: query
        required: false
        description: Time resolution of data
        schema:
          type: string
          enum:
          - hourly
          - daily
          default: hourly
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-OK-RealTime-DemandResponse-json'
              example:
                data:
                - interval: string
                  demand: 0
                page:
                  pageNumber: 0
                  pageSize: 0
                  totalElements: 0
                  totalPages: 0
                  lastPage: true
        '400':
          description: Invalid date format
          content:
            application/json: {}
        '401':
          description: Invalid or missing Bearer Token in the Authorization header
          content:
            application/json: {}
        '404':
          description: Date not found
          content:
            application/json: {}
      tags:
      - Real Time
  /v1/real-time/{date}/demand/load-state-estimator:
    servers:
    - url: https://apim.misoenergy.org/lgi
    get:
      operationId: get-v1-real-time-date-demand-load-state-estimator
      summary: Real-Time State Estimator Load
      description: Preliminary actual load (in megawatt-hours) as determined by the state estimator and reported in EIA-930 filings, in hourly or daily intervals. Available at 7am EST the day after. Aggregated by zone groups to preserve market participant confidentiality.
      parameters:
      - name: date
        in: path
        required: true
        description: 'Market date in the form: yyyy-mm-dd'
        schema:
          type: string
          format: date
      - name: interval
        in: query
        required: false
        description: Filter to a specific time interval (ex. "13:05", "13"), in Eastern Standard Time (UTC−05:00).
        schema:
          type: string
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: timeResolution
        in: query
        required: false
        description: Time resolution of data
        schema:
          type: string
          enum:
          - hourly
          - daily
          default: hourly
      - name: zone
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-OK-Demand-EstResponse-json'
              example:
                data:
                - timeInterval:
                    resolution: daily
                    start: '2023-06-28 00:00:00.000'
                    end: '2023-06-29 00:00:00.000'
                    value: '2023-06-29'
                  zone: string
                  demand: 0
                page:
                  pageNumber: 0
                  pageSize: 0
                  totalElements: 0
                  totalPages: 0
                  lastPage: true
        '400':
          description: Invalid date format
          content:
            application/json: {}
        '401':
          description: Invalid or missing Bearer Token in the Authorization header
          content:
            application/json: {}
        '404':
          description: Date not found
          content:
            application/json: {}
      tags:
      - Real Time
  /v1/real-time/{date}/generation/cleared/supply:
    servers:
    - url: https://apim.misoenergy.org/lgi
    get:
      operationId: get-v1-real-time-date-generation-cleared-supply
      summary: Real-Time Cleared Generation
      description: Generation cleared (in megawatts) in the real-time market, in hourly or 5-minute intervals. Available at 7am EST the day after.
      parameters:
      - name: date
        in: path
        required: true
        description: 'Market date in the form: yyyy-mm-dd'
        schema:
          type: string
          format: date
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: timeResolution
        in: query
        required: false
        description: Time resolution of data
        schema:
          type: string
          enum:
          - 5min
          - hourly
          default: hourly
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-OK-Gen-ClearedResponse-json'
              example:
                data:
                - generation: 0
                  timeInterval:
                    resolution: daily
                    start: '2023-06-28 00:00:00.000'
                    end: '2023-06-29 00:00:00.000'
                    value: '2023-06-29'
                page:
                  pageNumber: 0
                  pageSize: 0
                  totalElements: 0
                  totalPages: 0
                  lastPage: true
        '400':
          description: Invalid date format
          content:
            application/json: {}
        '401':
          description: Invalid or missing Bearer Token in the Authorization header
          content:
            application/json: {}
        '404':
          description: Date not found
          content:
            application/json: {}
      tags:
      - Real Time
