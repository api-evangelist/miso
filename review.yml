sources:
- url: https://www.misoenergy.org/markets-and-operations/RTDataAPIs/
  type: Documentation
  note: The documentation home for the open Public API. Carries MISO's 2025-12-12 JSON-only restructure notice and the once-per-minute courtesy limit.
- url: https://public-api.misoenergy.org/
  type: APIReference
  note: The endpoint table itself — thirty-seven links across MISO's own Operations Displays and Markets Displays groupings.
- url: https://data-exchange.misoenergy.org/
  type: DeveloperPortal
  note: MISO Data Exchange, an Azure API Management developer portal with self-serve signup and two published APIs.
- url: https://help.misoenergy.org/knowledgebase/article/KA-01489/en-us
  type: Documentation
  note: >-
    MISO Data Exchange FAQs. "The MISO Data Exchange comprises APIs (Application
    Programming Interfaces) that enable users to access MISO Market Report data for use in
    their own applications." Access is by MISO website profile plus a Data Exchange
    account; credential is an API KEY that does not expire; rate limits are "100
    call/minute" and "24,000 call/day", returning 429 and 403 respectively.
- url: https://help.misoenergy.org/knowledgebase/article/KA-01000/en-us
  type: Documentation
  note: >-
    Access MISO Market and Operations Data. Confirms programmatic access exists for MUI
    2.0, the Emergency Demand Response Tool, the FTR Tool, the MISO Market Portal, the MISO
    Communications System, Module E Capacity Tracking and the Physical Security System —
    all market participant tools behind the Extranet.
- url: https://cdn.misoenergy.org/MUI%202.0%20API%20User%20Guide629008.pdf
  type: Documentation
  note: The only published contract for MUI 2.0. Base URLs, registration requirement, and Market Portal certificate references.
- url: https://www.misoenergy.org/meet-miso/about-miso/
  type: Documentation
  note: Corporate identity, footprint and scale, in MISO's own words.
- url: https://www.misoenergy.org/meet-miso/legal-and-privacy/
  type: TermsOfService
  note: Privacy Notice and Terms of Use, including the automation clause and the clause under which additional posted conditions prevail.

actions:
  apisYmlCreated: true
  apisListed: 6
  openapiDirCreated: true
  specsSaved: 4
  reason: >-
    Four OpenAPI documents were saved and all four validate against the OpenAPI
    specification. Two were assembled verbatim from MISO Data Exchange's anonymously
    served APIM portal metadata (its own export ships empty paths); two were assembled for
    the Public API from MISO's published endpoint table plus the live anonymous payloads,
    because MISO publishes no specification for that surface. Every document carries an
    x-provenance block naming every source URL and fetch date. Two further apis[] entries —
    the Market Reports bulk file surface and the MUI 2.0 market participant API — are
    listed as verified surfaces with documentation links only, because neither has a
    machine-readable contract to harvest and none was invented. No consumer-data, Green
    Button, ESPI, CDR or OpenID Connect artifact was found or created, because none exists.
