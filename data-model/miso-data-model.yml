description: 'The entity graph of MISO''s keyed Data Exchange APIs, derived from the components.schemas
  MISO serves from its own developer portal. It is a flat, denormalised, time-series model rather than
  a relational object graph: there are no ids, no cross-entity foreign keys and no nesting beyond a shared
  TimeInterval value object and the paging envelope. Every record is keyed implicitly by (market date,
  interval, location) where location is a Commercial Pricing Node, a Reserve Zone, a Region or an adjacent
  Balancing Authority. The Public API half of MISO''s surface is deliberately excluded — its payloads
  are display shapes with no declared component schemas at all.'
style: time-series / denormalised; no entity identifiers, no foreign keys
