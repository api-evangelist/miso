  - node — Commercial Pricing Node (e.g. ALTW.WELLS1)
  - zone — Reserve Zone (8 zones)
  - region — MISO region
  - adjacentBa — adjacent Balancing Authority
envelope:
  shape: '{data: [<record>], page: PageInfo}'
  note: Every list response wraps its records in this envelope; PageInfo carries pageNumber, pageSize,
    totalElements, totalPages and lastPage.
