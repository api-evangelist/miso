notes:
- The LMP record decomposes price into lmp, mcc (marginal congestion), mec (marginal energy) and mlc (marginal
  losses) — mec + mcc + mlc reconstructs lmp.
- Interchange records are provisional for up to 105 days after the market day due to reconciliation.
- There is no id-prefix scheme because there are no ids; joins across entities are done on (date, interval,
  location).
