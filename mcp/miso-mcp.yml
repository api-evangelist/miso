    market (ASM), by reserve zone in 5-minute intervals. Available at 7am EST the day after. [On May 6,
    2026 Changes Applied including historical dates] 5-minute interval labels corrected. The database
    stores end-of-interval timestamps. Previously, the API returned interval values misaligned with database
    storage. Now corrected: ''value'', ''start'', and ''end'' fields correctly represent period START
    time (and end time in ''end'' field). To update stored data: subtract 5 minutes from all three fields.
    Before (old stored data): {"value": "2025-12-31T23:55:00", "start": "2025-12-31T23:55:00", "end":
    "2026-01-01T00:00:00"}. After (corrected): {"value": "2025-12-31T23:50:00", "start": "2025-12-31T23:50:00",
    "end": "2025-12-31T23:55:00"}. Apply this offset to all stored 5-minute interval records. No re-fetch
    required.'
